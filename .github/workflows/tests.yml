name: Tests
on:
  push:
    branches: [main]
    paths:
      - 'epl/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Python UTF-8 mode: make open() default to UTF-8 on every OS so tests that
    # read UTF-8-generated files (e.g. nginx configs with box-drawing chars)
    # don't hit Windows' cp1252 default and UnicodeDecodeError.
    env:
      PYTHONUTF8: '1'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.11', '3.12']
        exclude:
          - os: macos-latest
            python-version: '3.9'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install EPL
        shell: bash
        run: pip install -e ".[dev,llvm,secure]" 2>/dev/null || pip install -e ".[dev]" 2>/dev/null || pip install -e .
      - name: Run tests
        shell: bash
        run: python -m pytest tests/ -x --tb=short -q
      - name: Verify CLI
        shell: bash
        run: |
          epl --version
          echo 'Say "Hello from CI"' > test_ci.epl
          epl run test_ci.epl
