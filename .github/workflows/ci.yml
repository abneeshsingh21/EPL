name: EPL CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs that need more request it explicitly.
permissions:
  contents: read

# One in-flight run per ref. Cancel superseded PR runs (a new push makes the
# old one moot); never cancel a main-branch run (those are the source of truth
# for the required status checks and for release tagging).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# NOTE: this is the SINGLE source of truth for CI. The required status checks in
# branch protection are exactly `lint` and `test (ubuntu-latest, 3.12)` — keep
# those job/matrix names stable or merges will block on missing contexts. The
# old standalone lint.yml / tests.yml duplicated these checks and were removed.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check epl/ tests/ --output-format=github
      - name: Ruff format check
        run: ruff format --check epl/ tests/

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    # Python UTF-8 mode so open() defaults to UTF-8 on every OS (Windows' cp1252
    # default otherwise breaks reads of UTF-8-generated files).
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
        exclude:
          # macOS runners ship without 3.9/3.10 pre-installed; keep matrix smaller
          - os: macos-latest
            python-version: '3.9'
          - os: macos-latest
            python-version: '3.10'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,cloud,llvm,secure]
          pip install pytest-cov

      # The whole suite runs on every matrix cell — no hardcoded file list, so a
      # newly-added test file gates automatically (the old curated list silently
      # skipped new tests). On the required ubuntu/3.12 cell it also enforces the
      # coverage floor, so a coverage regression fails the REQUIRED check rather
      # than a separate, non-blocking job.
      - name: Run test suite + coverage gate (ubuntu/3.12)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          python -m pytest tests/ --tb=short -q \
            --cov=epl --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=45

      - name: Run test suite
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') }}
        shell: bash
        run: python -m pytest tests/ --tb=short -q

      - name: Upload coverage report (ubuntu/3.12)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            .coverage
            coverage.xml

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Type-check (strict, blocking)
        # Whole-tree mypy is BLOCKING and the debt ledger is EMPTY: all modules
        # under epl/ (excluding official_packages) type-check clean. A new type
        # error fails CI — no per-module exemptions remain.
        run: mypy epl/ --ignore-missing-imports --exclude 'epl/official_packages'

  build:
    # Prove the package still builds and is publishable on every change, so a
    # broken sdist/wheel (bad MANIFEST, metadata, or packaging change) is caught
    # in CI instead of at release time.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Validate distribution metadata
        run: twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  dependency-review:
    # Blocks a PR that introduces a dependency with a known vulnerability or a
    # disallowed license. PR-only (compares base..head); needs the dependency
    # graph, which is enabled for public repos.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  security:
    # Advisory dependency audit of the full pinned set. Kept non-blocking on
    # purpose: a transitive CVE with no fixed release yet must not wedge every
    # PR. `dependency-review` above is the blocking gate for NEW vulnerable deps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - name: Audit dependencies (advisory)
        run: pip-audit --requirement requirements.txt || true
