name: EPL CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check epl/ tests/ --output-format=github
      - name: Ruff format check
        run: ruff format --check epl/ tests/

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,cloud]

      - name: Run tests
        run: >
          python -m pytest tests/ --tb=short -q
          --ignore=tests/test_comprehensive.py
          --ignore=tests/test_deploy.py
          --ignore=tests/test_legacy_harness_smoke.py
          --ignore=tests/test_llvm_optimization.py
          --ignore=tests/test_new_features.py
          --ignore=tests/test_new_modules.py
          --ignore=tests/test_phase1.py
          --ignore=tests/test_phase2.py
          --ignore=tests/test_phase2_stdlib.py
          --ignore=tests/test_phase3_web.py
          --ignore=tests/test_phase5.py
          --ignore=tests/test_phase5_tooling.py
          --ignore=tests/test_phase6.py
          --ignore=tests/test_phase7.py
          --ignore=tests/test_production_gaps.py
          --ignore=tests/test_production_power.py
          --ignore=tests/test_reference_apps.py
          --ignore=tests/test_release_packaging.py
          --ignore=tests/test_tier4.py
          --ignore=tests/test_webapp.py

      - name: Run coverage (Ubuntu 3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: >
          python -m pytest tests/ --tb=short -q
          --cov=epl --cov-report=term-missing
          --ignore=tests/test_comprehensive.py
          --ignore=tests/test_deploy.py
          --ignore=tests/test_legacy_harness_smoke.py
          --ignore=tests/test_llvm_optimization.py
          --ignore=tests/test_new_features.py
          --ignore=tests/test_new_modules.py
          --ignore=tests/test_phase1.py
          --ignore=tests/test_phase2.py
          --ignore=tests/test_phase2_stdlib.py
          --ignore=tests/test_phase3_web.py
          --ignore=tests/test_phase5.py
          --ignore=tests/test_phase5_tooling.py
          --ignore=tests/test_phase6.py
          --ignore=tests/test_phase7.py
          --ignore=tests/test_production_gaps.py
          --ignore=tests/test_production_power.py
          --ignore=tests/test_reference_apps.py
          --ignore=tests/test_release_packaging.py
          --ignore=tests/test_tier4.py
          --ignore=tests/test_webapp.py

      - name: Upload coverage (Ubuntu 3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit --requirement requirements.txt || true
