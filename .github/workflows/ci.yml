name: EPL CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check epl/ tests/ --output-format=github
      - name: Ruff format check
        run: ruff format --check epl/ tests/

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
        exclude:
          # macOS runners ship without 3.9/3.10 pre-installed; keep matrix smaller
          - os: macos-latest
            python-version: '3.9'
          - os: macos-latest
            python-version: '3.10'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,cloud]
          pip install pytest-cov

      - name: Run stable test suite
        shell: bash
        run: |
          python -m pytest \
            tests/test_3d_canvas.py \
            tests/test_advanced_features.py \
            tests/test_asgi_real.py \
            tests/test_benchmark_baselines.py \
            tests/test_cli_production.py \
            tests/test_cloud.py \
            tests/test_cloud_deploy.py \
            tests/test_compiler.py \
            tests/test_consistency.py \
            tests/test_desktop_style_3d.py \
            tests/test_error_diagnostics.py \
            tests/test_error_explainer.py \
            tests/test_formatter_regression.py \
            tests/test_framework.py \
            tests/test_fuzz.py \
            tests/test_gc.py \
            tests/test_github_workflows.py \
            tests/test_integration_real.py \
            tests/test_interpreter_comprehensive.py \
            tests/test_ios_style_3d.py \
            tests/test_js_3d_canvas.py \
            tests/test_js_bridge.py \
            tests/test_js_transpiler.py \
            tests/test_k8s.py \
            tests/test_kotlin.py \
            tests/test_kotlin_gen.py \
            tests/test_kotlin_style_3d.py \
            tests/test_llvm.py \
            tests/test_lockfile.py \
            tests/test_observability.py \
            tests/test_official_packages.py \
            tests/test_package_manager.py \
            tests/test_package_trust.py \
            tests/test_phase1_native.py \
            tests/test_phase3.py \
            tests/test_phase3_reliability.py \
            tests/test_phase4.py \
            tests/test_phase4_security.py \
            tests/test_security_hardening.py \
            tests/test_platform_contract.py \
            tests/test_playground_assistant.py \
            tests/test_playground_runtime.py \
            tests/test_prod_ready.py \
            tests/test_production.py \
            tests/test_production_gap_contracts.py \
            tests/test_production_upgrade.py \
            tests/test_python_dependency_bridge.py \
            tests/test_reference_monitoring.py \
            tests/test_runtime_limits.py \
            tests/test_safe_mode_generics.py \
            tests/test_stability.py \
            tests/test_strict_type.py \
            tests/test_style_layout.py \
            tests/test_syntax_compatibility.py \
            tests/test_tier3.py \
            tests/test_triple_ecosystem.py \
            tests/test_v05.py \
            tests/test_v14_features.py \
            tests/test_v4.py \
            tests/test_visibility.py \
            tests/test_vm.py \
            tests/test_web_route_context.py \
            tests/test_web_server.py \
            --tb=short -q

      - name: Run coverage (Ubuntu 3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pytest \
            tests/test_advanced_features.py \
            tests/test_cli_production.py \
            tests/test_compiler.py \
            tests/test_consistency.py \
            tests/test_error_diagnostics.py \
            tests/test_framework.py \
            tests/test_interpreter_comprehensive.py \
            tests/test_js_transpiler.py \
            tests/test_kotlin_gen.py \
            tests/test_package_manager.py \
            tests/test_phase3.py \
            tests/test_phase3_reliability.py \
            tests/test_phase4.py \
            tests/test_phase4_security.py \
            tests/test_security_hardening.py \
            tests/test_production.py \
            tests/test_vm.py \
            --tb=short -q --cov=epl --cov-report=term-missing --cov-fail-under=0

      - name: Upload coverage (Ubuntu 3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run mypy
        run: mypy epl/ --ignore-missing-imports --exclude 'epl/official_packages'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit --requirement requirements.txt || true
