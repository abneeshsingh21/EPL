name: Release

# Tag-triggered release: build → validate → publish to PyPI (trusted publishing,
# no API token) → cut a GitHub Release with the built artifacts attached.
#
# ── One-time setup required before the first tagged release ──────────────────
# Register a PyPI Trusted Publisher for the `eplang` project so the publish step
# can mint a short-lived OIDC token instead of using a long-lived API token:
#   PyPI → project `eplang` → Settings → Publishing → Add a pending publisher
#     Owner:        abneeshsingh21
#     Repository:   EPL
#     Workflow:     release.yml
#     Environment:  pypi
# Until that publisher exists, pushing a v* tag will build + validate but the
# publish job will fail (loudly, by design) — nothing is shipped half-way.
#
# To release:  bump epl.__version__, commit on green main, then:
#   git tag vX.Y.Z && git push origin vX.Y.Z

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Validate distribution metadata
        run: twine check dist/*
      - name: Verify tag matches package version
        # Guard against tagging vX.Y.Z while epl.__version__ still says something
        # else — a mismatch would publish a confusingly-named release.
        run: |
          PKG_VERSION="$(python -c 'import epl; print(epl.__version__)')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package=$PKG_VERSION tag=$TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match epl.__version__ ($PKG_VERSION)"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  github-release:
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
