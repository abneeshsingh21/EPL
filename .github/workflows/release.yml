name: Release

# Tag-triggered release: build → validate → publish to PyPI (trusted publishing,
# no API token) → cut a GitHub Release with the built artifacts attached.
#
# The publish step is IDEMPOTENT: it first checks whether that exact version is
# already on PyPI and skips the upload if so (succeeding green). This makes the
# whole workflow safe to re-run, and lets a version that was published out-of-band
# (e.g. a manual `twine upload`) still be tagged and given a GitHub Release without
# a spurious "file already exists" failure.
#
# ── One-time setup before the first OIDC-published release ───────────────────
# Register a PyPI Trusted Publisher for the `eplang` project so the publish step
# can mint a short-lived OIDC token instead of using a long-lived API token:
#   PyPI → project `eplang` → Settings → Publishing → Add a pending publisher
#     Owner:        abneeshsingh21
#     Repository:   EPL
#     Workflow:     release.yml
#     Environment:  pypi
# Until that publisher exists, tagging a version that is NOT already on PyPI will
# build + validate but the publish step fails (loudly, by design) — nothing ships
# half-way. Tagging a version that IS already on PyPI skips publish and is green.
#
# To release:  bump epl.__version__, commit on green main, then:
#   git tag vX.Y.Z && git push origin vX.Y.Z

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-ci:
    # Enforce "release only from green main" as a real gate, not a comment.
    # ci.yml runs on push to main (not on tags), so the tagged commit already has
    # recorded check runs; require the gating contexts to have concluded success
    # for THIS exact commit before anything is built or published. A maintainer
    # cannot ship a tag that points at an untested or policy-failing commit.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Require consolidated CI to have passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Same contexts branch protection requires on main, plus the build job.
          required=("lint" "test (ubuntu-latest, 3.12)" "build")
          runs="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '.check_runs[] | {name, conclusion}')"
          echo "Check runs for ${GITHUB_SHA}:"
          echo "$runs"
          for ctx in "${required[@]}"; do
            ok="$(printf '%s' "$runs" | jq -rs --arg n "$ctx" \
              '[.[] | select(.name == $n)] | any(.conclusion == "success")')"
            if [ "$ok" != "true" ]; then
              echo "::error::Required CI check '$ctx' did not succeed for $GITHUB_SHA; refusing to release."
              exit 1
            fi
          done
          echo "All required CI checks passed for $GITHUB_SHA."

  build:
    needs: verify-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false # only reads the tree to build; no git push
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Validate distribution metadata
        run: twine check dist/*
      - name: Verify tag matches package version
        # Guard against tagging vX.Y.Z while epl.__version__ still says something
        # else — a mismatch would publish a confusingly-named release.
        run: |
          PKG_VERSION="$(python -c 'import epl; print(epl.__version__)')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package=$PKG_VERSION tag=$TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match epl.__version__ ($PKG_VERSION)"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Check whether this version is already on PyPI
        id: pypi_state
        # Idempotency guard: PyPI rejects re-uploading an existing version, which
        # would fail a re-run or a tag for an out-of-band (manual) publish. Probe
        # the JSON API — HTTP 200 = published, 404 = not yet — and only publish
        # when the version is genuinely new.
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/eplang/${VERSION}/json")"
          if [ "$code" = "200" ]; then
            echo "eplang ${VERSION} is already on PyPI — skipping publish (idempotent)."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "eplang ${VERSION} not found on PyPI (HTTP ${code}) — will publish."
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to PyPI
        if: steps.pypi_state.outputs.already_published == 'false'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  github-release:
    needs: pypi-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      # No checkout: `gh release create` operates over the API with GH_TOKEN, so
      # a working tree (and a persisted write-scoped credential in it) is unneeded.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Create or refresh the GitHub Release
        # Idempotent like the publish step: create the Release on first run, or
        # refresh its artifacts if it already exists (so a re-run never fails on a
        # pre-existing release).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — refreshing artifacts."
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
