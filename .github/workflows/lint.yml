name: Code Quality (Ruff)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install Ruff
        run: pip install ruff
        
      # Scope to the shipped package + its tests. The landing page
      # (landing_page/) is the website, maintained in its own repo
      # (abneeshsingh21/epl-website); it is not part of the core EPL
      # package and must not gate core CI. Matches ci.yml's scope.
      - name: Run Ruff Format Check
        run: ruff format --check epl/ tests/

      - name: Run Ruff Linter
        run: ruff check epl/ tests/
