[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eplang"
dynamic = ["version"]
description = "EPL - English Programming Language: write code in plain English. Build apps, web servers, and more."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [{name = "Abneesh Singh", email = "contact@eplang.me"}]
keywords = ["programming-language", "english", "english-programming-language", "epl", "eplang", "interpreter", "compiler", "transpiler", "natural-language"]
dependencies = [
    "flask>=3.0,<4.0",
    "requests>=2.31,<3.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

[project.optional-dependencies]
llvm = ["llvmlite>=0.42.0,<1.0"]
ai = ["openai>=1.0.0,<2.0"]
secure = ["keyring>=24.0.0,<26.0", "cryptography>=42.0,<47.0"]
server = [
    "waitress>=2.1.0,<4.0",
    "uvicorn>=0.30.0,<1.0",
    "hypercorn>=0.16.0,<1.0",
    "daphne>=4.1.0,<5.0",
    "gunicorn>=21.2,<24.0; platform_system != 'Windows'",
]
redis = ["redis>=5.0.0,<6.0"]
repl = ["prompt_toolkit>=3.0.0,<4.0", "pygments>=2.15.0,<3.0"]
cloud = ["boto3>=1.28.0,<2.0"]
dev = ["pytest>=7.0,<9.0", "coverage>=7.0,<8.0", "build>=1.0.0,<2.0", "ruff>=0.1.0,<1.0", "mypy>=1.8,<2.0"]
all = [
    "waitress>=2.1.0,<4.0",
    "uvicorn>=0.30.0,<1.0",
    "hypercorn>=0.16.0,<1.0",
    "daphne>=4.1.0,<5.0",
    "gunicorn>=21.2,<24.0; platform_system != 'Windows'",
    "prompt_toolkit>=3.0.0,<4.0",
    "pygments>=2.15.0,<3.0",
    "boto3>=1.28.0,<2.0",
    "keyring>=24.0.0,<26.0",
]

[project.scripts]
epl = "epl.cli:main"
epl-mcp = "epl.mcp_server:main"

[project.urls]
Homepage = "https://eplang.me"
Documentation = "https://github.com/abneeshsingh21/EPL/tree/main/docs"
Repository = "https://github.com/abneeshsingh21/EPL"
Changelog = "https://github.com/abneeshsingh21/EPL/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "epl.__version__"}

[tool.setuptools]
include-package-data = true
py-modules = ["main"]

[tool.setuptools.packages.find]
# Match the `epl` package and its subpackages only. The previous `epl*` glob
# also matched the separate `epl-website` repo when checked out alongside,
# leaking website files into the wheel.
include = ["epl", "epl.*"]
exclude = ["epl._internal*", "dist*", "build*", "tests*", "epl-website*"]

[tool.setuptools.package-data]
epl = [
    "registry.json",
    "runtime.c",
    "models/Modelfile",
    "official_packages/*/*.toml",
    "official_packages/*/*.md",
    "official_packages/*/src/*.epl",
    "official_packages/*/examples/*.epl",
    "stdlib/*.epl",
    "stdlib/registry.json",
    "templates/android/gradlew",
    "templates/android/gradlew.bat",
    "templates/android/gradle/wrapper/*.jar",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["epl"]
omit = ["tests/*", "examples/*"]

# Honest, enforced floor. Whole-suite coverage of epl/ measures ~48%; the floor
# sits just below that as a ratchet (coverage can only go up, never silently
# regress), and CI enforces it on the required ubuntu/3.12 job. The previous
# `fail_under = 60` was never reached AND never enforced (CI passed
# `--cov-fail-under=0`), so it was an aspirational claim, not a gate. Raise this
# as real coverage grows.
[tool.coverage.report]
fail_under = 45
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["epl", "tests"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "RUF034",  # useless if-else (both arms identical) — found real bugs, kept at zero
]
ignore = [
    "E501",  # line too long
    "E721",  # type comparison (use isinstance)
    "E722",  # bare except
    "E731",  # lambda assignment
    "E741",  # ambiguous variable name
    "W291",  # trailing whitespace
    "W293",  # blank line with whitespace
    # NOTE: B004, B023, F601, F811 are deliberately NOT ignored — they each
    # caught real bugs in the v9.6.0 hardening pass and are now kept at zero
    # violations so the class cannot silently regrow.
    "B007",  # unused loop control variable
    "B008",  # function call in argument defaults
    "B011",  # assert False
    "B028",  # no explicit stacklevel
    # B904 (raise-without-from) is enforced — all re-raises chain explicitly
    # (`from e` to preserve cause, `from None` for deliberate domain-error
    # replacement). Kept at zero so traceback hygiene cannot regress.
    "C401",  # unnecessary generator set
    "C405",  # unnecessary literal set
    "C414",  # unnecessary double cast
    "C901",  # too complex
    "E402",  # module import not at top
    "F401",  # unused import (intentional in tests)
    "F841",  # unused variable
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
exclude = [
    "epl/official_packages",
    "benchmarks",
]
implicit_optional = true
ignore_missing_imports = true

# ── Strict type-check gate ─────────────────────────────────────────────────
# The ENTIRE tree (all 75 modules under epl/, excluding official_packages) is
# type-checked and BLOCKING in CI — `mypy epl/` reports zero errors. The debt
# ledger that used to exempt modules here is now empty: there is no type debt
# left to ratchet down. Keep it that way — a new mypy error fails CI.
