[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eplang"
dynamic = ["version"]
description = "EPL - English Programming Language: write code in plain English. Build apps, web servers, and more."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [{name = "Abneesh Singh", email = "singhabneesh250@gmail.com"}]
keywords = ["programming-language", "english", "interpreter", "compiler", "transpiler"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

[project.optional-dependencies]
llvm = ["llvmlite>=0.41.0"]
ai = ["openai>=1.0.0"]
server = [
    "waitress>=2.1.0",
    "uvicorn>=0.30.0",
    "hypercorn>=0.16.0",
    "daphne>=4.1.0",
    "gunicorn>=21.2; platform_system != 'Windows'",
]
redis = ["redis>=5.0.0"]
repl = ["prompt_toolkit>=3.0.0", "pygments>=2.15.0"]
cloud = ["boto3>=1.28.0"]
dev = ["pytest>=7.0", "coverage>=7.0", "build>=1.0.0", "ruff>=0.1.0"]
all = [
    "waitress>=2.1.0",
    "uvicorn>=0.30.0",
    "hypercorn>=0.16.0",
    "daphne>=4.1.0",
    "gunicorn>=21.2; platform_system != 'Windows'",
    "prompt_toolkit>=3.0.0",
    "pygments>=2.15.0",
    "boto3>=1.28.0",
]

[project.scripts]
epl = "epl.cli:main"
epl-mcp = "epl.mcp_server:main"

[project.urls]
Homepage = "https://github.com/abneeshsingh21/EPL"
Documentation = "https://github.com/abneeshsingh21/EPL/tree/main/docs"
Repository = "https://github.com/abneeshsingh21/EPL"
Changelog = "https://github.com/abneeshsingh21/EPL/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "epl.__version__"}

[tool.setuptools]
include-package-data = true
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["epl*"]
exclude = ["epl._internal*", "dist*", "build*", "tests*"]

[tool.setuptools.package-data]
epl = [
    "registry.json",
    "runtime.c",
    "models/Modelfile",
    "official_packages/*/*.toml",
    "official_packages/*/*.md",
    "official_packages/*/src/*.epl",
    "official_packages/*/examples/*.epl",
    "stdlib/*.epl",
    "stdlib/registry.json",
    "templates/android/gradlew",
    "templates/android/gradlew.bat",
    "templates/android/gradle/wrapper/*.jar",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["epl"]
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["epl", "tests"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long
    "E721",  # type comparison (use isinstance)
    "E722",  # bare except
    "E731",  # lambda assignment
    "E741",  # ambiguous variable name
    "W291",  # trailing whitespace
    "W293",  # blank line with whitespace
    "B004",  # unreliable callable check
    "B007",  # unused loop control variable
    "B008",  # function call in argument defaults
    "B011",  # assert False
    "B023",  # function uses loop variable
    "B028",  # no explicit stacklevel
    "B904",  # raise without from in except
    "C401",  # unnecessary generator set
    "C405",  # unnecessary literal set
    "C414",  # unnecessary double cast
    "C901",  # too complex
    "E402",  # module import not at top
    "F401",  # unused import (intentional in tests)
    "F601",  # dict key repeated
    "F811",  # redefinition of unused name
    "F841",  # unused variable
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
