image: python:3.9
stages:
- lint
- build
- test
- deploy
variables:
  PROJECT_NAME: EPL
cache:
  paths:
  - .cache/pip
  - venv/
  - node_modules/
lint_job:
  stage: lint
  script:
  - flake8 . && black --check .
build_job:
  stage: build
  script:
  - pip install -r requirements.txt
  artifacts:
    paths:
    - dist/
    - build/
    expire_in: 1 week
test_job:
  stage: test
  script:
  - pytest tests/
  artifacts:
    reports:
      junit: test-results/*.xml
deploy_job:
  stage: deploy
  script:
  - echo 'Deploying application...'
