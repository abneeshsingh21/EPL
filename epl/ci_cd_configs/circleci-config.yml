version: 2.1
jobs:
  build:
    docker:
    - image: python:3.9
    steps:
    - checkout
    - run:
        name: Install dependencies
        command: pip install -r requirements.txt
    - persist_to_workspace:
        root: .
        paths:
        - .
  test:
    docker:
    - image: python:3.9
    steps:
    - checkout
    - attach_workspace:
        at: .
    - run:
        name: Run tests
        command: pytest tests/
  deploy:
    docker:
    - image: python:3.9
    steps:
    - checkout
    - run:
        name: Deploy
        command: echo 'Deploying application...'
workflows:
  version: 2
  build_test_deploy:
    jobs:
    - build
    - test:
        requires:
        - build
    - deploy:
        requires:
        - test
        filters:
          branches:
            only:
            - main
